# macOS 专属配置

# --- 窗口装饰 ---
# Linux 下设置了 window-decoration = none，导致 macOS 下无法移动
# 将其恢复为 auto 以恢复标题栏并允许移动
window-decoration = auto

# 使用标准标题栏
macos-titlebar-style = native

# 将左侧 Option 键映射为 Alt (常用于 Terminal 操作)
macos-option-as-alt = left

# 针对 macOS 的字体优化
# font-size = 11

theme = Catppuccin Frappe
